---
- name: "Install Dependencies"
  ansible.builtin.apt:
    name: "{{ packages }}"
    state: 'present'
  vars:
    packages:
      - 'default-jre'
      - 'python3-lxml'

- name: 'Check if Solr is already installed'
  ansible.builtin.stat:
    path: '/etc/init.d/solr'
  register: 'solr_service'

- name: 'Install Solr'
  ansible.builtin.include_tasks:
    file: 'install.yml'
  when: solr_service.stat.exists == False

- name: 'Apache Configuration'
  ansible.builtin.copy:
    src:  'apache.conf'
    dest: '/etc/apache2/sites-enabled/conf.d/solr.conf'
  notify: 'apache_restart'

- name: 'Disable Solr Request Log'
  community.general.ini_file:
    path:   '/etc/default/solr.in.sh'
    option: 'SOLR_REQUESTLOG_ENABLED'
    value:  'false'
  notify: 'solr_restart'

- name: 'Gzip log files'
  community.general.xml:
    path:  '/srv/solr/log4j2.xml'
    xpath: "//RollingRandomAccessFile[@name='MainLogFile']"
    attribute: 'filePattern'
    value: '${sys:solr.log.dir}/solr.log.%i.gz'
    pretty_print: true
  notify: 'solr_restart'
...
